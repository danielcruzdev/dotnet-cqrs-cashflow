name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # TreatWarningsAsErrors está ligado no Directory.Build.props: qualquer
      # warning novo derruba o build aqui, não só na máquina de quem escreveu.
      - name: Lançamentos — build e testes de unidade
        run: dotnet test src/lancamentos-service/Lancamentos.slnx -c Release

      - name: Consolidado — build e testes de unidade
        run: dotnet test src/consolidado-service/Consolidado.slnx -c Release

      # Sobe PostgreSQL, RabbitMQ e Redis por Testcontainers — o runner do
      # GitHub já traz Docker. É o passo que executa o teste do requisito
      # âncora (Consolidado fora do ar não impede o POST).
      - name: Ponta a ponta e resiliência
        run: dotnet test src/tests-e2e/Cashflow.E2E.slnx -c Release
